  <style>
    #app-loader { position: fixed; inset:0; display:grid; place-items:center; z-index:9999;
      background: radial-gradient(1200px 800px at 20% -10%, rgba(0, 140, 255, 0.18), transparent 60%),
                  radial-gradient(1200px 800px at 120% 110%, rgba(120, 0, 255, 0.16), transparent 60%),
                  #0a1429; }
    .ma-spinner { width:54px; height:54px; position:relative; filter: drop-shadow(0 0 10px rgba(0,160,255,.45));
      animation: ma-fadein 300ms ease-out; }
    .ma-spinner:before, .ma-spinner:after { content:''; position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:#39c3ff; border-right-color:#39c3ff; }
    .ma-spinner:before { animation: ma-spin 800ms linear infinite; opacity:.9 }
    .ma-spinner:after { inset:6px; animation: ma-spin 1200ms linear infinite reverse; opacity:.6 }
    @keyframes ma-spin { to { transform: rotate(360deg) } }
    @keyframes ma-fadein { from { opacity:0; transform: translateY(6px)} to { opacity:1; transform:none } }
  </style>
