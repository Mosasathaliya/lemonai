name: Deploy to Cloudflare

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.mightyagent.yourdomain.com' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || 'wss://ws.mightyagent.yourdomain.com' }}

      - name: Install Wrangler CLI
        run: npm install -g @cloudflare/wrangler

      - name: Configure Wrangler
        run: |
          wrangler config --api-token ${{ secrets.CF_API_TOKEN }}
          wrangler whoami

      - name: Deploy to Cloudflare
        run: |
          # Set environment variables for Cloudflare
          echo "CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "CF_ZONE_ID=${{ secrets.CF_ZONE_ID }}" >> $GITHUB_ENV
          
          # Set secrets
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          
          # Deploy using Wrangler
          wrangler deploy --env production

      - name: Verify deployment
        run: |
          # Simple health check
          curl --fail https://mightyagent.yourdomain.com/health || exit 1

      - name: Post deployment notification
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: '#36a64f'
          SLACK_TITLE: '✅ Deployment Successful'
          SLACK_MESSAGE: 'Mighty Agent has been deployed to production!'
          SLACK_USERNAME: 'Deployment Bot'

  # Additional job for running end-to-end tests after deployment
  e2e-tests:
    name: Run E2E Tests
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: https://mightyagent.yourdomain.com
          
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
