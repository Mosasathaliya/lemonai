# Project Metadata
name = "mighty-agent"
main = "cloudflare/worker/index.ts"
compatibility_date = "2024-10-10"
compatibility_flags = ["nodejs_compat"]

# Environment Configuration
[env.production]
name = "mighty-agent"
route = "mightyagent.yourdomain.com/*"

[env.staging]
name = "mighty-agent-staging"
route = "staging.mightyagent.yourdomain.com/*"

# AI Configuration
[ai]
binding = "AI"

# Database Configuration
[[d1_databases]]
binding = "DB"
database_name = "mighty-agent-db"
database_id = "f77d8af5-1966-48d1-9e83-c0a781fcec9c"

# Storage Configuration
[[r2_buckets]]
binding = "mighty_agent_storage"
bucket_name = "mighty-agent-storage"

[[r2_buckets]]
binding = "mighty_agent_userdata"
bucket_name = "mighty-agent-userdata"

# Container Configuration
[containers]
# This will use the local Dockerfile
image = "mighty-agent:latest"
build = { context = ".", dockerfile = "Dockerfile.cloudflare" }

# Resource limits
[containers.resources]
cpu = 2
memory = "10Gi"

# Logging
logpush = true

# Durable Objects (required for containers)
[[durable_objects.bindings]]
name = "MIGHTY_AGENT_CONTAINER"
class_name = "MightyAgentContainer"

# Durable Objects Migrations
[[migrations]]
tag = "v1"
new_classes = ["MightyAgentContainer"]

# Site configuration (if needed)
[site]
bucket = "./dist"