name = "mighty-agent-containers"
main = "cloudflare/worker/index.ts"
compatibility_date = "2024-10-10"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "mighty-agent-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mighty-agent-storage"

[[r2_buckets]]
binding = "USER_DATA"
bucket_name = "mighty-agent-userdata"

[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
CF_ACCOUNT_ID = "YOUR_ACCOUNT_ID"
CF_API_TOKEN = "YOUR_API_TOKEN"
D1_DATABASE_ID = "YOUR_D1_DATABASE_ID"
R2_BUCKET_NAME = "mighty-agent-storage"
KV_NAMESPACE_ID = "YOUR_KV_NAMESPACE_ID"

[[containers]]
class_name = "MightyAgentContainer"
image = "registry.cloudflare.com/mighty-agent-containers-mightyagentcontainer:fab57ce7"
instance_type = "standard-4"
max_instances = 5

[[durable_objects.bindings]]
name = "MIGHTY_AGENT_CONTAINER"
class_name = "MightyAgentContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MightyAgentContainer"]

[build]
command = "pnpm run build"
watch_dir = "src"
